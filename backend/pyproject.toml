[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accounting-office-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.8,<3", "uvicorn>=0.34,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
