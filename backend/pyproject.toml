[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accounting-office-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic-settings>=2.8,<3", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4", "argon2-cffi>=25.1,<26", "PyJWT>=2.10,<3", "email-validator>=2.2,<3", "python-multipart>=0.0.32,<1", "google-genai==2.29.0", "langgraph==1.2.14", "langgraph-checkpoint-postgres==3.1.2", "langchain-core==1.6.9", "mcp==2.3.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gemini: 명시적으로 허용한 Gemini 실 네트워크 검증"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
