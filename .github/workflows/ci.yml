name: Quality
on:
  push:
    branches: [main, feat/repository-skeleton, feat/database-foundation, feat/identity-company, feat/accounting-master, feat/storage-evidence-intake]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app
      - run: python -m pip check
      - run: python -m pytest --ignore=tests/integration
  postgresql:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foundation_test
          POSTGRES_PASSWORD: ci_placeholder_only
          POSTGRES_DB: accounting_foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundation_test -d accounting_foundation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      POSTGRES_URL: postgresql://foundation_test:ci_placeholder_only@localhost:5432/accounting_foundation_test
      TEST_POSTGRES_URL: postgresql://foundation_test:ci_placeholder_only@localhost:5432/accounting_foundation_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m alembic current
      - run: python -m alembic upgrade head
      - run: python -m alembic current --check-heads
      - run: python -m alembic check
      - run: python -m pytest tests/integration --require-postgres
      - run: python -m app.companies.infrastructure.seed
      - run: python -m app.companies.infrastructure.seed
      - run: python -m app.accounting.templates.infrastructure.seed
      - run: python -m app.accounting.templates.infrastructure.seed
      - run: python -m alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/dev.py env
      - run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet
