name: Quality
on:
  push:
    branches: [main, feat/repository-skeleton, feat/database-foundation, feat/identity-company, feat/accounting-master, feat/storage-evidence-intake, feat/onboarding-data-exchange, feat/transaction-journal-ledger, feat/finance-subledger-settlement, feat/p0-agent-runtime-foundation, feat/accounting-dimensions, feat/import-transaction-promotion, feat/bank-card-reconciliation]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      postgresql: ${{ steps.paths.outputs.postgresql }}
      infrastructure: ${{ steps.paths.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "postgresql=true" >> "$GITHUB_OUTPUT"
            echo "infrastructure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          postgresql=false
          infrastructure=false
          while IFS= read -r file; do
            case "$file" in
              backend/app/agents/graphs/accounting_question.py|backend/app/agents/runtime/controller.py|backend/app/llm/contracts.py|backend/tests/unit/*|backend/tests/contract/*)
                ;;
              backend/*|scripts/verify_accounting_schema.py)
                postgresql=true
                ;;
            esac
            case "$file" in
              infra/*|scripts/dev.py|scripts/bootstrap_local.py|backend/Dockerfile|frontend/Dockerfile|backend/requirements-dev.lock|frontend/package-lock.json|.env.example)
                infrastructure=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "postgresql=$postgresql" >> "$GITHUB_OUTPUT"
          echo "infrastructure=$infrastructure" >> "$GITHUB_OUTPUT"
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app
      - run: python -m pip check
      - run: python -m pytest --ignore=tests/integration
  postgresql:
    needs: scope
    if: needs.scope.outputs.postgresql == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foundation_test
          POSTGRES_PASSWORD: ci_placeholder_only
          POSTGRES_DB: accounting_foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundation_test -d accounting_foundation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      POSTGRES_URL: postgresql://foundation_test:ci_placeholder_only@localhost:5432/accounting_foundation_test
      TEST_POSTGRES_URL: postgresql://foundation_test:ci_placeholder_only@localhost:5432/accounting_foundation_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m alembic current
      - run: python -m alembic upgrade head
      - run: python -m alembic current --check-heads
      - run: python -m alembic check
      - name: 은행 카드 대사·관계형 스키마·회계·재무·Agent·산업별 연간 Golden 회귀
        run: python -m pytest tests/integration --require-postgres
      - name: 업무 테이블과 JSON·FK 실제 수치 검증
        run: python ../scripts/verify_accounting_schema.py
      - run: python -m app.companies.infrastructure.seed
      - run: python -m app.companies.infrastructure.seed
      - run: python -m app.accounting.templates.infrastructure.seed
      - run: python -m app.accounting.templates.infrastructure.seed
      - run: python -m alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  infrastructure:
    needs: scope
    if: needs.scope.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/dev.py env
      - run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet
      - name: 백엔드·프론트엔드 포함 로컬 환경 실행
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait
      - name: 로컬 계정·회사 준비 및 중복 실행 검증
        run: |
          python scripts/bootstrap_local.py
          python scripts/bootstrap_local.py
      - run: docker compose --env-file .env -f infra/docker-compose.yml ps
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down
