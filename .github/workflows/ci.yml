name: Quality
on:
  push:
    branches: [main, feat/repository-skeleton, feat/database-foundation, feat/identity-company, feat/accounting-master, feat/storage-evidence-intake, feat/onboarding-data-exchange, feat/transaction-journal-ledger, feat/finance-subledger-settlement, feat/p0-agent-runtime-foundation, feat/accounting-dimensions, feat/import-transaction-promotion, feat/bank-card-reconciliation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      full_postgresql: ${{ steps.paths.outputs.full_postgresql }}
      full_infrastructure: ${{ steps.paths.outputs.full_infrastructure }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "full_postgresql=true" >> "$GITHUB_OUTPUT"
            echo "full_infrastructure=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "full_postgresql=false" >> "$GITHUB_OUTPUT"
            echo "full_infrastructure=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          full_postgresql=false
          full_infrastructure=false
          while IFS= read -r file; do
            case "$file" in
              infra/*|scripts/dev.py|scripts/bootstrap_local.py|backend/Dockerfile|frontend/Dockerfile|backend/requirements-dev.lock|frontend/package-lock.json|.env.example)
                full_infrastructure=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" HEAD)
          echo "full_postgresql=$full_postgresql" >> "$GITHUB_OUTPUT"
          echo "full_infrastructure=$full_infrastructure" >> "$GITHUB_OUTPUT"
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app
      - run: python -m pip check
      - run: python -m pytest --ignore=tests/integration
  postgresql:
    needs: scope
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: foundation_test
          POSTGRES_PASSWORD: ci_placeholder_only
          POSTGRES_DB: accounting_foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundation_test -d accounting_foundation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENVIRONMENT: test
      POSTGRES_URL: postgresql://foundation_test:ci_placeholder_only@localhost:5432/accounting_foundation_test
      TEST_POSTGRES_URL: postgresql://foundation_test:ci_placeholder_only@localhost:5432/accounting_foundation_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m alembic upgrade head
      - run: python -m alembic current --check-heads
      - name: 전체 PostgreSQL 회귀 (수동 실행)
        if: needs.scope.outputs.full_postgresql == 'true'
        run: python -m pytest tests/integration --require-postgres --durations=20
      - name: PostgreSQL 핵심 회계·스키마 검증
        if: needs.scope.outputs.full_postgresql != 'true'
        run: >-
          python -m pytest
          tests/integration/test_database_values.py
          tests/integration/test_schema_policy.py
          tests/integration/test_journal_flow.py
          tests/integration/test_posting_concurrency.py
          tests/integration/test_agent_reporting_tools.py
          --require-postgres
      - name: 업무 테이블과 JSON·FK 실제 수치 검증
        run: python ../scripts/verify_accounting_schema.py
      - run: python -m app.companies.infrastructure.seed
      - run: python -m app.companies.infrastructure.seed
      - run: python -m app.accounting.templates.infrastructure.seed
      - run: python -m app.accounting.templates.infrastructure.seed
      - run: python -m alembic check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  infrastructure:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/dev.py env
      - run: docker compose --env-file .env -f infra/docker-compose.yml config --quiet
      - name: 백엔드·프론트엔드 포함 로컬 환경 실행
        if: needs.scope.outputs.full_infrastructure == 'true'
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --build --wait
      - name: PostgreSQL·Redis 기본 서비스 상태 확인
        if: needs.scope.outputs.full_infrastructure != 'true'
        run: docker compose --env-file .env -f infra/docker-compose.yml up -d --wait postgres redis
      - name: 로컬 계정·회사 준비 및 중복 실행 검증
        if: needs.scope.outputs.full_infrastructure == 'true'
        run: |
          python scripts/bootstrap_local.py
          python scripts/bootstrap_local.py
      - run: docker compose --env-file .env -f infra/docker-compose.yml ps
      - if: always()
        run: docker compose --env-file .env -f infra/docker-compose.yml down
